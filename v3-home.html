<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>发芽搭子 · 有人陪你慢慢来</title>
<style>
  :root{--bg:#FAF9F6;--brand:#49745F;--brand-lt:#EEF5F0;--ink:#202521;--sub:#6F756F;--line:#E7E9E6;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:86px;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px;}
  .brand{font-weight:800;font-size:17px;letter-spacing:.3px;}
  .brand i{font-style:normal;color:var(--brand);}
  .hero{padding:26px 20px 22px;}
  .hero h1{font-size:26px;line-height:1.4;font-weight:800;}
  .hero h1 span{color:var(--brand);}
  .hero p{margin-top:10px;font-size:14px;color:var(--sub);line-height:1.7;}
  .cta{display:inline-flex;align-items:center;gap:6px;margin-top:16px;background:var(--brand);color:#fff;border:none;border-radius:24px;padding:13px 24px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s;}
  .cta:active{transform:scale(.98);}
  .sec{padding:0 20px;margin-top:8px;}
  .sec-t{font-size:15px;font-weight:700;margin:20px 0 12px;}
  .needs{display:flex;flex-wrap:wrap;gap:10px;}
  .need{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 15px;font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .12s,border-color .2s;}
  .need:active{transform:scale(.97);border-color:var(--brand);}
  .how{display:flex;flex-direction:column;gap:10px;}
  .how-i{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 15px;}
  .hi2{width:36px;height:36px;border-radius:11px;background:var(--brand-lt);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .how-i b{display:block;font-size:13.5px;}
  .how-i i{display:block;font-style:normal;font-size:12px;color:var(--sub);margin-top:2px;line-height:1.6;}
  .pgrid{display:flex;flex-direction:column;gap:10px;}
  .per{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:all .15s;background:#fff;}
  .per.on{border-color:var(--brand);background:var(--brand-lt);}
  .per:active{transform:scale(.98);}
  .per .pn{font-size:13.5px;font-weight:800;}
  .per .pq{font-size:12px;color:var(--sub);margin-top:4px;}
  .pnote{font-size:11.5px;color:var(--sub);margin-top:10px;}
  /* 继续我的搭子 */
  .resume{display:none;margin-top:4px;background:var(--brand-lt);border-radius:20px;padding:18px 20px;}
  .resume.show{display:block;}
  .resume .r-name{font-size:15px;font-weight:800;margin-top:8px;}
  .resume .r-sub{font-size:12.5px;color:var(--sub);margin-top:4px;}
  .resume .r-cta{margin-top:12px;display:inline-block;background:var(--brand);color:#fff;border-radius:18px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;border:none;}
  /* 推荐卡 */
  .cards{display:flex;flex-direction:column;gap:12px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;cursor:pointer;transition:transform .12s;}
  .card:active{transform:scale(.985);}
  .c-head{display:flex;align-items:center;gap:10px;}
  .c-icon{width:44px;height:44px;border-radius:14px;background:var(--brand-lt);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;}
  .c-name{font-size:15.5px;font-weight:800;}
  .c-badge{font-size:10.5px;color:var(--brand);background:var(--brand-lt);border-radius:10px;padding:2px 8px;margin-left:8px;font-weight:700;}
  .c-promise{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.6;}
  .c-meta{margin-top:10px;font-size:11.5px;color:var(--sub);}
  .c-go{float:right;font-size:12.5px;color:var(--brand);font-weight:700;}
  .all{display:block;text-align:center;margin:18px auto 8px;font-size:13.5px;color:var(--brand);font-weight:700;cursor:pointer;background:none;border:none;}
  /* 发芽中 */
  .sprow{display:flex;flex-direction:column;gap:10px;}
  .sp{display:flex;align-items:center;gap:10px;background:#fff;border:1px dashed #CFE3D6;border-radius:16px;padding:12px 14px;cursor:pointer;transition:transform .12s;}
  .sp:active{transform:scale(.985);}
  .sp-i{width:36px;height:36px;border-radius:11px;background:var(--brand-lt);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .sp-b{flex:1;min-width:0;}
  .sp-n{font-size:13.5px;font-weight:800;}
  .sp-p{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.5;}
  .sp-btn{flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--brand);border:1.5px solid var(--brand);border-radius:14px;padding:5px 11px;cursor:pointer;}
  .sp-btn.on{background:var(--brand);color:#fff;}
  footer{padding:10px 20px 20px;text-align:center;font-size:11.5px;color:var(--sub);}
  /* 底部导航 */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:50;}
  .nav a{flex:1;text-align:center;text-decoration:none;color:var(--sub);font-size:10.5px;}
  .nav a .ni{font-size:20px;display:block;margin-bottom:2px;}
  .nav a.on{color:var(--brand);font-weight:700;}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(32,37,33,.88);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;}
</style>
</head>
<body>
  <div class="top"><div class="brand">🌱 发芽<i>搭子</i></div><div style="font-size:18px">🔍</div></div>

  <div class="hero">
    <h1>人生很复杂，<br>你不用<span>一个人扛</span>。</h1>
    <p>找一个搭子，陪你发芽。<br>不要求你一次改变很多，做一件就很好。</p>
    <button class="cta" onclick="location.href='v3-store.html'">找到我的搭子 →</button>
  </div>

  <div class="sec">
    <div class="resume" id="resume">
      <div style="font-size:12px;color:var(--brand);font-weight:700">🌱 继续我的搭子</div>
      <div class="r-name" id="rName"></div>
      <div class="r-sub" id="rSub"></div>
      <button class="r-cta" id="rGo">继续今天 →</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-t">你现在更接近哪种状态？</div>
    <div class="needs" id="needs"></div>
    <div class="pnote">按你现在的感觉挑，不按分类挑 —— 同一个搭子可以在好几个分类里。</div>
  </div>

  <div class="sec" id="style">
    <div class="sec-t">你希望搭子怎么陪你？</div>
    <div class="pgrid" id="pgrid"></div>
    <div class="pnote">选择会记住，对所有搭子生效。</div>
  </div>

  <div class="sec">
    <div class="sec-t">每个搭子都会这样陪你</div>
    <div class="how">
      <div class="how-i"><span class="hi2">🌱</span><div><b>每天只给你几个小行动</b><i>不要求一次改变很多，做一件就很好。</i></div></div>
      <div class="how-i"><span class="hi2">💬</span><div><b>卡住的时候陪你聊</b><i>不是催你，而是一起找到真正的阻力。</i></div></div>
      <div class="how-i"><span class="hi2">📈</span><div><b>帮你看见自己的变化</b><i>把过去几天真实发生的改变告诉你。</i></div></div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-t">为你精选</div>
    <div class="cards" id="cards"></div>
    <button class="all" onclick="location.href='v3-store.html'">查看全部搭子 →</button>
  </div>

  <div class="sec" id="sprout"></div>

  <footer>慢慢来，比较快 · 发芽搭子</footer>

  <div class="nav">
    <a class="on" href="v3-home.html"><span class="ni">🏠</span>首页</a>
    <a href="v3-store.html"><span class="ni">✨</span>找搭子</a>
    <a href="index.html"><span class="ni">☀️</span>今日</a>
    <a href="javascript:soon()"><span class="ni">👤</span>我的</a>
  </div>
  <div class="toast" id="toast"></div>

<script src="v3-data.js"></script>
<script>
(function(){
  var V = window.V3;
  /* 情绪入口：按「你现在的状态」找搭子，而不是按品类 */
  document.getElementById('needs').innerHTML = V.moods.map(function(n){
    return '<div class="need" data-n="' + n.key + '">' + n.emoji + ' ' + n.label + '</div>';
  }).join('');
  document.getElementById('needs').addEventListener('click', function(e){
    var el = e.target.closest('.need'); if (!el) return;
    location.href = 'v3-store.html?mood=' + el.getAttribute('data-n');
  });
  /* 精选 3 个 */
  var feat = V.featured.slice(0, 3).map(V.partnerById).filter(Boolean);
  document.getElementById('cards').innerHTML = feat.map(function(p){
    return '<div class="card" data-id="' + p.id + '">' +
      '<span class="c-go">了解一下 →</span>' +
      '<div class="c-head"><div class="c-icon">' + p.icon + '</div>' +
      '<div><span class="c-name">' + p.name + '</span>' + (p.badge ? '<span class="c-badge">' + p.badge + '</span>' : '') + '</div></div>' +
      '<div class="c-promise">' + p.promise + '</div>' +
      '<div class="c-meta">' + p.duration + ' · ' + p.dailyTime + '</div></div>';
  }).join('');
  document.getElementById('cards').addEventListener('click', function(e){
    var el = e.target.closest('.card'); if (!el) return;
    location.href = 'v3-detail.html?id=' + el.getAttribute('data-id');
  });
  /* 继续我的搭子（最近开启过的） */
  try {
    var last = JSON.parse(localStorage.getItem('v3_mine') || 'null');
    if (last && last.id) {
      var p = V.partnerById(last.id);
      if (p) {
        var box = document.getElementById('resume');
        box.classList.add('show');
        document.getElementById('rName').textContent = p.icon + ' 我的' + p.name;
        document.getElementById('rSub').textContent = '开启于 ' + (last.at || '') + ' · 今天先做一件小事就很好';
        document.getElementById('rGo').onclick = function(){ location.href = p.href; };
      }
    }
  } catch (e) {}
  /* 🌱 发芽中：还没长出来的搭子，可以预约 */
  var sprouts = V.partners.filter(function(p){ return p.soon; });
  var spBox = document.getElementById('sprout');
  if (sprouts.length) {
    var wait = [];
    try { wait = JSON.parse(localStorage.getItem('v3_wait') || '[]'); } catch (e) {}
    spBox.innerHTML = '<div class="sec-t">🌱 正在发芽的搭子</div>' +
      '<div class="sprow">' + sprouts.map(function(p){
        var on = wait.indexOf(p.id) >= 0;
        return '<div class="sp" data-id="' + p.id + '"><div class="sp-i">' + p.icon + '</div>' +
          '<div class="sp-b"><div class="sp-n">' + p.name + '</div><div class="sp-p">' + p.promise + '</div></div>' +
          '<div class="sp-btn' + (on ? ' on' : '') + '" data-w="' + p.id + '">' + (on ? '已预约 ✓' : '提醒我') + '</div></div>';
      }).join('') + '</div>';
    spBox.addEventListener('click', function(e){
      var btn = e.target.closest('.sp-btn');
      if (btn) {
        var pid = btn.getAttribute('data-w');
        var arr = [];
        try { arr = JSON.parse(localStorage.getItem('v3_wait') || '[]'); } catch (err) {}
        var i = arr.indexOf(pid);
        if (i >= 0) { arr.splice(i, 1); btn.textContent = '提醒我'; btn.classList.remove('on'); toast('已取消提醒'); }
        else { arr.push(pid); btn.textContent = '已预约 ✓'; btn.classList.add('on'); toast('记住了 · 发芽后第一个告诉你 🌱'); }
        try { localStorage.setItem('v3_wait', JSON.stringify(arr)); } catch (err) {}
        return;
      }
      var card = e.target.closest('.sp');
      if (card) location.href = 'v3-detail.html?id=' + card.getAttribute('data-id');
    });
  }

  /* 陪伴风格（全局，存 v3_mine.style，详情页/搭子页读取） */
  var savedStyle = 'gentle';
  try { var m0 = JSON.parse(localStorage.getItem('v3_mine') || '{}'); if (m0.style) savedStyle = m0.style; } catch (e) {}
  var pg = document.getElementById('pgrid');
  pg.innerHTML = V.personalities.map(function(x){
    return '<div class="per' + (x.key === savedStyle ? ' on' : '') + '" data-k="' + x.key + '"><div class="pn">' + x.emoji + ' ' + x.name + '</div><div class="pq">“' + x.quote + '”</div></div>';
  }).join('');
  pg.addEventListener('click', function(e){
    var el = e.target.closest('.per'); if (!el) return;
    pg.querySelectorAll('.per').forEach(function(x){ x.classList.remove('on'); });
    el.classList.add('on');
    try {
      var m = {};
      try { m = JSON.parse(localStorage.getItem('v3_mine') || '{}') || {}; } catch (err) {}
      m.style = el.getAttribute('data-k');
      localStorage.setItem('v3_mine', JSON.stringify(m));
    } catch (err) {}
    toast('记住了 · 以后搭子都按这个风格陪你');
  });

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._m); t._m = setTimeout(function(){ t.style.opacity = '0'; }, 1500);
  }
  window.soon = function(){
    toast('「我的」即将上线 · 敬请期待');
  };
})();
</script>
</body>
</html>
