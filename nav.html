<!DOCTYPE html>

<head data-page-node-id="WWYpuQR6R1iCKFeUnR5gWF">

<title>Slim Partner · 每日搭子中心</title>
<style>
  /* ===========================================================
     [基础变量] —— 想换主题色 / 圆角 / 间距，只改这里
     =========================================================== */
  :root {
    --bg:           #fafaf7;
    --surface:      #ffffff;
    --ink:          #1f2330;
    --ink-soft:     #5b6273;
    --line:         #ecedf0;
    --brand:        #5b6cff;
    --brand-soft:   #eef0ff;
    --accent:       #ff7a45;
    --ok:           #16a34a;
    --warn:         #d97706;
    --radius-lg:    18px;
    --radius-md:    10px;
    --shadow-sm:    0 1px 2px rgba(20,22,30,.06), 0 1px 1px rgba(20,22,30,.04);
    --shadow-md:    0 8px 24px rgba(20,22,30,.08);
    --space-1:      8px;
    --space-2:      16px;
    --space-3:      24px;
    --space-4:      32px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ===========================================================
     [顶层容器]
     =========================================================== */
  .app {
    max-width: 960px;
    margin: 0 auto;
    padding: var(--space-4) var(--space-2);
  }

  /* ===========================================================
     [头部：标题 + 本月精选卡]
     =========================================================== */
  .header { text-align: center; margin-bottom: var(--space-3); padding-bottom: var(--space-3); border-bottom: 1px solid var(--line); }
  .header h1 {
    margin: 0 0 var(--space-1);
    font-size: 28px;
    letter-spacing: .5px;
  }
  .header .lead {
    color: var(--ink-soft);
    margin: 0 0 var(--space-3);
  }

  /* 首屏 CTA（先试一次） */
  .home-trial-btn {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #5b9eff, #3a7ca5);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .5px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(58,124,165,0.30);
    transition: transform .15s, box-shadow .2s;
  }
  .home-trial-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(58,124,165,0.38); }
  .home-trial-btn:active { transform: scale(0.97); }
  .home-trial-sub {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-3);
  }

  /* 引导层 / 付费墙 / Toast 通用遮罩 */
  .fp-overlay {
    position: fixed; inset: 0;
    background: rgba(20,22,30,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    padding: 20px;
    animation: fpFadeIn .25s ease;
  }
  @keyframes fpFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .fp-card {
    background: #fff;
    border-radius: 28px;
    padding: 28px 22px 22px;
    max-width: 380px; width: 100%;
    box-shadow: 0 22px 50px rgba(0,0,0,0.30);
    animation: fpPop .35s cubic-bezier(0.2, 1, 0.3, 1.05);
    max-height: calc(100vh - 80px); overflow-y: auto;
    position: relative;
  }
  @keyframes fpPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .fp-card .fp-title { font-size: 19px; font-weight: 800; color: var(--ink); margin-bottom: 4px; text-align: center; }
  .fp-card .fp-sub { font-size: 13px; color: var(--ink-2); text-align: center; margin-bottom: 18px; }
  .fp-close {
    position: absolute; top: 14px; right: 14px;
    background: rgba(255,255,255,0.7); border: none; cursor: pointer;
    width: 32px; height: 32px; border-radius: 50%; font-size: 18px; line-height: 1;
    color: var(--ink-3);
  }

  /* 引导层选项网格 */
  .fp-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .fp-option {
    border: 1.5px solid #e9edf2;
    border-radius: 18px;
    padding: 18px 12px 14px;
    text-align: center;
    cursor: pointer;
    background: #fcfdfe;
    transition: all .15s;
  }
  .fp-option:hover { border-color: #3a7ca5; transform: translateY(-2px); }
  .fp-option .opt-emoji { font-size: 32px; line-height: 1; margin-bottom: 6px; }
  .fp-option .opt-text { font-size: 13px; font-weight: 600; color: var(--ink); }

  /* 付费墙 */
  .pw-summary {
    display: grid; gap: 8px;
    background: #f7f9fc;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .pw-summary-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--ink-2);
  }
  .pw-summary-row b { color: var(--ink); }

  .pw-pricing {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 16px;
  }
  .pw-pricing-card {
    border: 1.5px solid #e9edf2;
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    background: #fff;
    cursor: pointer;
    transition: all .15s;
    position: relative;
  }
  .pw-pricing-card.featured {
    border-color: #22c55e;
    background: #f0fdf4;
    box-shadow: 0 4px 10px rgba(34,197,94,0.12);
  }
  .pw-pricing-card .plan-name { font-size: 12px; color: var(--ink-2); }
  .pw-pricing-card .plan-price {
    font-size: 22px; font-weight: 800; color: var(--ink); margin: 4px 0;
  }
  .pw-pricing-card .plan-price small { font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .pw-pricing-card .plan-tag {
    display: inline-block; font-size: 10px; padding: 2px 8px;
    border-radius: 999px; background: #22c55e; color: #fff; font-weight: 700;
  }

  .pw-points {
    background: linear-gradient(135deg, #fff4d6, #ffe8b3);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 12px;
    line-height: 1.6;
    color: #7a5a16;
  }
  .pw-points b { color: #5b3e0a; }

  .pw-cta-primary {
    width: 100%; padding: 14px;
    border: none; border-radius: 999px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; margin-bottom: 10px;
    box-shadow: 0 6px 14px rgba(34,197,94,0.32);
  }
  .pw-cta-primary:active { transform: scale(0.97); }
  .pw-cta-secondary {
    width: 100%; padding: 12px;
    border: 1.5px solid #e9edf2; border-radius: 999px;
    background: #fff; color: var(--ink-2);
    font-size: 13px; cursor: pointer;
  }
  .pw-cta-secondary:hover { border-color: var(--ink-3); }
  .pw-footnote {
    text-align: center; margin-top: 12px;
    font-size: 11px; color: var(--ink-3);
  }

  /* 内层 demo 占位 toast */
  .fp-mini {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--ink); color: #fff;
    padding: 12px 18px; border-radius: 14px;
    font-size: 13px; max-width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.30);
    z-index: 220; line-height: 1.55;
    animation: fpPop .25s ease;
  }
  .fp-mini b { color: #fbbf24; }

  .featured {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    background: linear-gradient(135deg, #fff4ec 0%, #ffe9d9 100%);
    border: 1px solid #ffd9bd;
    border-radius: var(--radius-lg);
    padding: var(--space-3);
    text-align: left;
    box-shadow: var(--shadow-sm);
    transition: transform .2s ease;
    text-decoration: none;
    color: inherit;
  }
  .featured:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .featured .emoji { font-size: 36px; }
  .featured .meta { flex: 1; }
  .featured h3 { margin: 0 0 4px; font-size: 17px; }
  .featured p  { margin: 0; color: var(--ink-soft); font-size: 13px; }
  /* —— "去看看 →" 改为文字链（弱化视觉，回归第一性：核心卡本身就是链接） —— */
  .featured .cta {
    background: transparent;
    color: var(--ink-soft);
    padding: 6px 0;
    border-radius: 0;
    font-size: 13px;
    text-decoration: none;
    white-space: nowrap;
    transition: color .2s;
  }
  .featured:hover .cta { color: var(--accent); }

  /* ===========================================================
     [状态条] —— 上次访问 / 今日打卡
     不喜欢整个状态条，直接删掉 .status-bar 这段样式 + HTML
     =========================================================== */
  .status-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--space-1);
    margin-bottom: var(--space-3);
    font-size: 12px;
    color: var(--ink-soft);
  }
  .status-bar .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .status-bar .pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ok);
  }
  .status-bar .pill.warn .dot { background: var(--warn); }
  .status-bar .pill .btn {
    border: 0; background: transparent;
    color: var(--brand); cursor: pointer;
    font-size: 12px; padding: 0;
    font-family: inherit;
  }
  .status-bar .pill .btn:hover { text-decoration: underline; }

  /* ===========================================================
     [Tab 切换]
     =========================================================== */
  .tabs {
    display: flex;
    gap: 6px;
    background: var(--surface);
    padding: 6px;
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    overflow-x: auto;
    margin-bottom: var(--space-3);
  }
  .tab {
    flex: 1;
    min-width: 90px;
    padding: 10px 12px;
    border: 0;
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    color: var(--ink-soft);
    font-family: inherit;
    transition: all .2s;
    white-space: nowrap;
  }
  .tab .count {
    display: inline-block;
    margin-left: 4px;
    font-size: 11px;
    background: var(--line);
    color: var(--ink-soft);
    padding: 1px 6px;
    border-radius: 999px;
  }
  .tab.active {
    background: var(--ink);
    color: #fff;
  }
  .tab.active .count {
    background: rgba(255,255,255,.18);
    color: #fff;
  }

  /* ===========================================================
     [工具条] —— 搜索 + 状态筛选
     =========================================================== */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin-bottom: var(--space-3);
    align-items: center;
  }
  .search {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    transition: border-color .2s, box-shadow .2s;
  }
  .search input:focus {
    outline: 0;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
  }
  .search::before {
    content: "🔎";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
  }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 6px 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all .15s;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .chip.active {
    background: var(--brand-soft);
    border-color: var(--brand);
    color: var(--brand);
    font-weight: 500;
  }

  /* ===========================================================
     [卡片网格]
     =========================================================== */
  .grid {
    display: grid;
    gap: var(--space-2);
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: var(--space-3);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    transition: all .2s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #d4d7e0;
    box-shadow: var(--shadow-md);
  }
  .card .top {
    display: flex;
    align-items: flex-start;
    gap: var(--space-1);
  }
  .card .emoji {
    font-size: 26px;
    line-height: 1;
    flex-shrink: 0;
  }
  .card h3 {
    margin: 0;
    font-size: 16px;
    flex: 1;
  }
  .card .desc {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 4px 0 0;
  }
  .card .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: auto;
    padding-top: var(--space-1);
  }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--line);
    color: var(--ink-soft);
  }
  .badge.ok      { background: #dcfce7; color: var(--ok); }
  .badge.warn    { background: #fef3c7; color: var(--warn); }
  .badge.new     { background: var(--brand-soft); color: var(--brand); }
  .badge.accent  { background: #ffe9d9; color: var(--accent); }
  .badge.preview { background: #f3f4f6; color: var(--ink-soft);
                    border: 1px dashed #c4c8d2; }

  /* —— "最新"角标：贴在卡片右上角 —— */
  .corner-new {
    position: absolute;
    top: 10px; right: 12px;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--brand);
    color: #fff;
    letter-spacing: .3px;
    z-index: 1;
  }

  /* —— preview 卡片：禁用 hover 提升 + 半透明，提示不可点击 —— */
  .card.preview {
    cursor: not-allowed;
    opacity: .85;
  }
  .card.preview:hover {
    transform: none;
    border-color: var(--line);
    box-shadow: none;
  }

  /* ===========================================================
     [空状态]
     =========================================================== */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: var(--space-4) 0;
    color: var(--ink-soft);
  }
  .empty .face { font-size: 40px; opacity: .4; margin-bottom: var(--space-1); }

  /* ===========================================================
     [元信息与页脚]
     =========================================================== */
  .meta {
    text-align: center;
    margin-top: var(--space-4);
    padding-top: var(--space-3);
    border-top: 1px dashed var(--line);
    color: var(--ink-soft);
    font-size: 13px;
  }
  .meta .stats { display: flex; justify-content: center; gap: var(--space-3); margin-bottom: var(--space-1); }
  .meta .stats span strong { color: var(--ink); }

  /* ===========================================================
     [右下角"今天休息一下"浮动按钮]
     —— 不是搭子（搭子是"一起做事"，这个是"允许你不做事"），
     —— 所以不进 PARTNERS_CONFIG、不占 Tab、不累计打卡、不记 localStorage。
     —— 视觉：温暖的便签纸 / 淡奶黄底，温和存在而非催促。
     =========================================================== */
  .rest-btn {
    position: fixed;
    bottom: 28px; right: 24px;
    background: #fff4d6;
    border: 1px solid #f0dba8;
    color: #8b6f3e;
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 12px rgba(212, 175, 55, 0.18), 0 1px 2px rgba(20,22,30,.04);
    transition: all .25s ease;
    z-index: 50;
    /* —— 呼吸感：3-4% 的轻微明暗浮动，像贴在角落的便签纸轻轻飘 —— */
    animation: restBreath 4.5s ease-in-out infinite;
  }
  .rest-btn .rest-emoji {
    display: inline-block;
    margin-right: 4px;
    font-size: 15px;
    line-height: 1;
    transform: translateY(0.5px);
  }
  .rest-btn:hover {
    background: #ffe9b5;
    border-color: #e6c98c;
    color: #6e552b;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(212, 175, 55, 0.28), 0 2px 4px rgba(20,22,30,.06);
    animation: none;
  }
  .rest-btn:active {
    transform: translateY(0);
    box-shadow: 0 2px 6px rgba(212, 175, 55, 0.22);
  }
  @keyframes restBreath {
    0%, 100% { box-shadow: 0 4px 12px rgba(212, 175, 55, 0.18), 0 1px 2px rgba(20,22,30,.04); }
    50%      { box-shadow: 0 6px 18px rgba(212, 175, 55, 0.26), 0 1px 2px rgba(20,22,30,.04); }
  }

  /* ===========================================================
     [响应式]
     =========================================================== */
  @media (max-width: 640px) {
    .app { padding: var(--space-2) var(--space-1); }
    .header h1 { font-size: 22px; }
    .featured { flex-wrap: wrap; }
    .featured .cta { width: 100%; text-align: center; margin-top: var(--space-1); }
    .rest-btn { bottom: 20px; right: 16px; padding: 10px 15px; font-size: 12px; }
  }
</style>

  <!-- =========================================================

/* ============================================================
 *  Tab 切换条 + 每项计数

function renderTabs() {
  const counts = PARTNERS_CONFIG.tabs.reduce((acc, t) => {
    /* —— 统计排除 hidden 的项，count 与卡片网格一致 —— */
    acc[t.key] = PARTNERS_CONFIG.partners.filter(p => p.tab === t.key && !p.hidden).length;
    return acc;
  }, {});

  $('tabs').innerHTML = PARTNERS_CONFIG.tabs.map(t => `
    <button class="tab ${t.key===state.tab?'active':''}" data-tab="${t.key}">
      ${t.emoji} ${t.label}<span class="count">${counts[t.key]||0}</span>
    </button>
  `).join('');
}

      <button class="chip ${state.status===s.key?'active':''}"
              data-status="${s.key}">${s.label}</button>
    `));

/* ============================================================
 *  卡片网格 —— 整块重画
 *  过滤规则：
 *    1) tab 必须等于当前 Tab
 *    2) 如果选了状态筛选，status 必须相等
 *    3) 搜索词会在 title + desc + tags 里大小写不敏感地匹配
 * ============================================================ */
function renderGrid() {
  const q    = state.q.trim().toLowerCase();
  const list = PARTNERS_CONFIG.partners.filter(p => {
    if (p.hidden) return false;             // hidden:true 整体不渲染
    if (p.tab !== state.tab) return false;
    if (state.status && p.status !== state.status) return false;
    if (q) {
      const hay = [p.title, p.desc, ...(p.tags||[])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (!list.length) {
    $('grid').innerHTML = `
      <div class="empty">
        <div class="face">🍃</div>
        <p>没有匹配的搭子，换个词试试？</p>
      </div>`;
    return;
  }

  $('grid').innerHTML = list.map(p => {
    /* —— 只显示分类标签，状态标签已移出卡片视觉（仅用于筛选） —— */
    const tagBadges = (p.tags || []).map(t =>
      `<span class="badge">${t}</span>`).join('');
    /* —— "最新"角标：仅 p.status === 'new'，放在卡片右上角 —— */
    const newCorner = p.status === 'new'
      ? `<span class="corner-new">最新</span>`
      : '';
    /* —— preview 模式：不可点击，显示敬请期待角标 —— */
    const previewBadge = p.preview
      ? `<span class="badge preview">敬请期待</span>`
      : '';
    /* —— preview 的卡片用 <div> 而非 <a>，确保点击完全不跳转 —— */
    const tag = p.preview ? 'div' : 'a';
    const hrefAttr = p.preview ? '' : ` href="${p.href}"`;
    return `
      <${tag} class="card ${p.preview?'preview':''}"${hrefAttr}>
        ${newCorner}
        <div class="top">
          <span class="emoji">${p.emoji}</span>
          <h3>${p.title}</h3>
        </div>
        <p class="desc">${p.desc}</p>
        <div class="tags">${tagBadges}${previewBadge}</div>
      </${tag}>`;
  }).join('');
}

/* ================================================================
 *  状态条 —— 上次访问 / 今日已打卡（localStorage）
 *  --------------------------------------------------------------
 *  存储 key：
 *    sp:lastVisit        ISO 时间戳字符串
 *    sp:checkin:{YYYY-MM-DD}  当天是否打卡过
 *    sp:totalCheckins    累计打卡次数（数字）
 * ================================================================ */
const STORAGE = {
  lastVisit:  'sp:lastVisit',
  today:      () => 'sp:checkin:' + new Date().toISOString().slice(0,10),
  total:      'sp:totalCheckins',
  freemium:   'sp:freemium',  // 新增 —— 付费墙元数据
};

const FREEMIUM = {
  freeUsesLimit:    5,                       // 前 N 次免费
  priceMonth:       9.9,                     // 月费 ¥
  priceYear:        99,                      // 年费 ¥
  yearSaveRatio:    0.17,                    // 年费省 17%
  pointsPerCheckin: 10,                      // 每日打卡 +10 积分
  streak7Bonus:     50,
  streak30Bonus:    200,
  pointsPerYuan:    100,                     // 100 积分 = ¥1
};

/**
 * freemium 状态（写入 localStorage 持久化）
 * @typedef {Object} FreemiumState
 * @property {string} firstSeenDate         - YYYY-MM-DD
 * @property {number} freeUsesUsed          - 第几次打卡（1-indexed，仅试玩期累积）
 * @property {boolean} paywallShown         - 是否已展示过付费墙（防止重复弹）
 * @property {?{since:string,price:number,status:string}} subscription
 */

function fmtTimeAgo(iso) {
  if (!iso) return '从未';
  const diff = Date.now() - new Date(iso).getTime();
  const min  = Math.floor(diff / 60000);
  if (min < 1)    return '刚刚';
  if (min < 60)   return min + ' 分钟前';
  if (min < 1440) return Math.floor(min / 60) + ' 小时前';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function checkinToday() {
  localStorage.setItem(STORAGE.today(), '1');
  const prev = Number(localStorage.getItem(STORAGE.total) || 0);
  localStorage.setItem(STORAGE.total, String(prev + 1));
  renderStatusBar();
}

function getFreemiumState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE.freemium) || '{}');
  } catch (e) { return {}; }
}
function setFreemiumState(s) {
  localStorage.setItem(STORAGE.freemium, JSON.stringify(s));
}
function ensureFreemiumState() {
  const s = getFreemiumState();
  if (!s.firstSeenDate) {
    s.firstSeenDate = new Date().toISOString().slice(0,10);
    s.freeUsesUsed  = 0;
    s.paywallShown  = false;
    s.subscription  = null;
    setFreemiumState(s);
  }
  return s;
}

/**
 * 完成一次打卡 —— 增加 freeUsesUsed 计数，并在第 5 次返回 'show_paywall'
 * @returns {string} 'normal' | 'show_paywall'
 */
function recordFreeUse() {
  const s = ensureFreemiumState();
  if (s.subscription) return 'normal';                  // 已订阅：不再累积 freeUses
  if (s.freeUsesUsed >= FREEMIUM.freeUsesLimit) return 'normal'; // 已经过 5 次：不再计数
  s.freeUsesUsed = (s.freeUsesUsed || 0) + 1;
  setFreemiumState(s);
  return (s.freeUsesUsed === FREEMIUM.freeUsesLimit) ? 'show_paywall' : 'normal';
}

function activateDemoSubscription() {
  const s = ensureFreemiumState();
  s.subscription = {
    since:  new Date().toISOString(),
    price:  FREEMIUM.priceMonth,
    status: 'demo_placeholder',   // 标记：这是 demo 占位，后续接入真支付
  };
  setFreemiumState(s);
}

function renderStatusBar() {
  const lastVisit = localStorage.getItem(STORAGE.lastVisit);
  const total     = Number(localStorage.getItem(STORAGE.total) || 0);
  const s         = ensureFreemiumState();

  // 最后访问
  const lastPill = `
    <span class="pill">
      <span class="dot"></span>
      上次访问：${fmtTimeAgo(lastVisit)}
    </span>`;

  // 状态条：根据 freemium 状态切换文案
  let statusPill = '';
  if (s.subscription) {
    // 已订阅（demo 标记）
    statusPill = `
      <span class="pill" style="background:#f0fff4;border-color:#86efac;">
        <span class="dot" style="background:#22c55e;"></span>
        ⭐ 已订阅（demo）· 累计打卡 <strong style="color:var(--ink);margin:0 4px">${total}</strong> 次
      </span>`;
  } else {
    const used  = s.freeUsesUsed || 0;
    const limit = FREEMIUM.freeUsesLimit;
    const left  = Math.max(0, limit - used);
    if (left > 0) {
      statusPill = `
        <span class="pill">
          <span class="dot"></span>
          🔓 免费体验中 · 还剩 <strong style="color:var(--ink);margin:0 4px">${left}</strong> / ${limit} 次
          · 累计打卡 <strong style="color:var(--ink);margin:0 4px">${total}</strong> 次
        </span>`;
    } else {
      statusPill = `
        <span class="pill warn">
          <span class="dot"></span>
          ⏳ 5 次免费体验已用完
          · <button class="btn" id="openPaywallBtn" style="color:#22c55e;font-weight:700;">立即订阅 ¥9.9/月</button>
        </span>`;
    }
  }

  $('statusBar').innerHTML = lastPill + statusPill;

  // 绑定"立即订阅"按钮 → 打开付费墙
  const payBtn = $('openPaywallBtn');
  if (payBtn) payBtn.addEventListener('click', () => openPaywall('entry_pill'));

  // 首页"先试一次"按钮：点完走 freemium 计数
  const trialBtn = $('homeTrialBtn');
  if (trialBtn) trialBtn.addEventListener('click', onHomeTrial);
}

/**
 * 首页"今天先免费试一次"按钮：点完一次，count + 1，并出现引导层
 */
function onHomeTrial() {
  const status = recordFreeUse();
  const total = Number(localStorage.getItem(STORAGE.total) || 0) + 1;
  localStorage.setItem(STORAGE.total, String(total));
  renderStatusBar();
  if (status === 'show_paywall') {
    openPaywall('after_5th_home_trial');
  } else {
    // 弹出引导层，让用户选一个方向
    openInterestPicker();
  }
}

function openInterestPicker() {
  // 若今天已经选过就不再重复弹
  const SEEN_KEY = 'sp:interestSeen:' + new Date().toISOString().slice(0,10);
  if (sessionStorage.getItem(SEEN_KEY)) return;
  sessionStorage.setItem(SEEN_KEY, '1');

  const overlay = document.createElement('div');
  overlay.className = 'fp-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) document.body.removeChild(overlay); };
  overlay.innerHTML = `
    <div class="fp-card" onclick="event.stopPropagation()">
      <button class="fp-close" onclick="document.body.removeChild(this.parentNode.parentNode)">×</button>
      <div class="fp-title">今天你最想改善什么？</div>
      <div class="fp-sub">选一个 · 直接进入对应的搭子页面</div>
      <div class="fp-options">
        ${INTEREST_OPTIONS.map(o => `
          <div class="fp-option" data-key="${o.key}" data-href="${o.href}">
            <div class="opt-emoji">${o.emoji}</div>
            <div class="opt-text">${o.text}</div>
          </div>
        `).join('')}
      </div>
      <div style="text-align:center;font-size:11px;color:var(--ink-3);margin-top:8px;">
        💡 选错了也没关系 · 随时可以从顶部 Tab 切换其他搭子
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  // 绑定选项点击
  overlay.querySelectorAll('.fp-option').forEach(opt => {
    opt.addEventListener('click', () => {
      const href = opt.getAttribute('data-href');
      document.body.removeChild(overlay);
      if (href && href !== '#grid') window.location.href = href;
      else window.scrollTo({ top: document.getElementById('grid').offsetTop, behavior: 'smooth' });
    });
  });
}

function closePaywall() {
  const el = document.getElementById('paywallOverlay');
  if (el && el.parentNode) el.parentNode.removeChild(el);
}

function showMini(html) {
  const el = document.createElement('div');
  el.className = 'fp-mini';
  el.innerHTML = html;
  document.body.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 4200);
}

/* ============================================================
 *  事件绑定
 * ============================================================ */
document.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (tab) {
    state.tab    = tab.dataset.tab;
    state.status = null;                  // 切 Tab 时把状态筛选清掉
    renderTabs();
    renderFilters();
    renderGrid();
    return;
  }
  const chip = e.target.closest('.chip');
  if (chip) {
    state.status = chip.dataset.status || null;
    renderFilters();
    renderGrid();
  }
});

let searchTimer;
$('search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.q = e.target.value;
    renderGrid();
  }, 120);                              // 简单防抖
});
