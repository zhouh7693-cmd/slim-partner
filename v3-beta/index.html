<style>
:root{
  --bg:#f6f2ea;--paper:#fffdf9;--ink:#19352c;--muted:#77817b;--line:#e7e0d6;
  --green:#547764;--deep:#274c3d;--soft:#e8f0eb;--cream:#f4ead9;--blush:#f3e1db;
  --blue:#e4edf0;--lilac:#ebe6f0;--sand:#f1eadc;--shadow:0 14px 34px rgba(41,63,53,.08);

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#eef0ec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
button,input{font:inherit}
button{color:inherit}
.app{width:min(100%,var(--phone));min-height:100vh;margin:auto;background:var(--bg);box-shadow:0 0 50px rgba(0,0,0,.08);position:relative;padding-bottom:84px;overflow-x:hidden}
.screen{display:none;min-height:calc(100vh - 76px)}
.screen.active{display:block}
.screen-inner{padding:0 18px 28px}
.header{height:74px;display:flex;align-items:center;justify-content:space-between}
.brandrow{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:13px;background:var(--deep);color:white;display:grid;place-items:center;font-weight:900;font-size:11px}.brand{font-weight:900;font-size:18px}.sub{font-size:11px;color:var(--muted);margin-top:1px}
.iconbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:15px;background:white;display:grid;place-items:center;color:var(--deep);cursor:pointer;transition:.16s;box-shadow:0 5px 14px rgba(39,76,61,.03)}
.iconbtn:active,.btn:active,.product:active,.row:active,.cat-btn:active,.task:active{transform:scale(.98)}
.searchbox{height:55px;border-radius:20px;border:1px solid var(--line);background:white;display:flex;align-items:center;gap:10px;padding:0 16px;box-shadow:0 7px 24px rgba(50,65,57,.04)}
.searchbox span{color:#8a928d}.searchbox input{border:0;outline:0;background:transparent;width:100%;font-size:14px;color:var(--ink)}.searchbox input::placeholder{color:#9aa19d}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:18px 0}
.cat-btn{border:0;background:transparent;text-align:center;font-size:11px;color:#737c77;cursor:pointer;padding:0;transition:.16s}.cat-btn i{display:grid;place-items:center;width:41px;height:41px;margin:0 auto 6px;border:1px solid var(--line);border-radius:14px;background:white;font-style:normal;font-size:16px;transition:.16s}.cat-btn.active{color:var(--deep);font-weight:850}.cat-btn.active i{background:var(--deep);color:white;border-color:var(--deep)}
.hero{min-height:218px;border-radius:30px;background:linear-gradient(135deg,#dce9e1 0%,#f1e8d9 56%,#f0ded7 100%);padding:25px 22px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero h1{font-size:29px;line-height:1.18;letter-spacing:-.045em;margin:8px 0 10px;max-width:285px}.hero p{font-size:13px;line-height:1.7;color:#5d6862;max-width:285px}.kicker{font-size:12px;color:var(--deep);font-weight:850}.bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.42)}.b1{width:150px;height:150px;right:-35px;top:-45px}.b2{width:100px;height:100px;right:25px;bottom:-35px}
.btn{border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:850;transition:.16s}.btn-primary{background:var(--deep);color:white;padding:12px 17px;font-size:13px}.btn-wide{width:100%;border-radius:18px;padding:15px 18px;font-size:15px}.btn-light{background:white;border:1px solid var(--line);padding:12px 17px;color:var(--deep)}
.section{padding-top:26px}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}.title{font-size:21px;font-weight:900;letter-spacing:-.03em}.desc{font-size:11px;color:var(--muted);margin-top:4px}.more{font-size:12px;color:var(--green);font-weight:850;border:0;background:transparent;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{border:1px solid var(--line);background:white;border-radius:24px;padding:10px 10px 14px;box-shadow:0 8px 24px rgba(40,55,47,.05);cursor:pointer;text-align:left;transition:.16s}.art{height:138px;border-radius:18px;display:grid;place-items:center;font-size:47px;position:relative;overflow:hidden}.art:after{content:"";position:absolute;width:88px;height:88px;border-radius:50%;right:-28px;top:-25px;background:rgba(255,255,255,.45)}.pname{font-size:16px;font-weight:900;margin:11px 3px 4px}.pline{font-size:11px;color:#647069;line-height:1.55;min-height:34px;margin:0 3px}.meta{font-size:10px;color:#6f7973;background:#f1f4f1;border-radius:999px;padding:5px 7px;display:inline-block;margin:10px 3px 0}
.story{display:flex;gap:12px;background:white;border:1px solid var(--line);border-radius:21px;padding:15px;box-shadow:0 7px 22px rgba(40,55,47,.04)}.story .ico{width:45px;height:45px;flex:0 0 45px;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-size:20px}.story strong{font-size:14px}.story span{font-size:11px;color:var(--muted);display:block;margin-top:4px;line-height:1.55}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,var(--phone));height:76px;background:rgba(252,250,246,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:30;padding:7px 8px;backdrop-filter:blur(12px)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:#8b918d;border-radius:14px;cursor:pointer}.nav button b{font-size:17px;font-weight:500}.nav button.active{color:var(--deep);font-weight:850;background:#edf2ee}
.storehead{padding-top:7px}.storetitle{font-size:28px;font-weight:950;letter-spacing:-.05em}.storelayout{display:grid;grid-template-columns:82px 1fr;gap:10px;margin-top:15px}.side{background:#efede8;border-radius:19px;padding:6px;height:max-content;position:sticky;top:8px}.side button{width:100%;border:0;background:transparent;padding:13px 5px;text-align:center;font-size:12px;color:#727a75;border-radius:13px;cursor:pointer;transition:.16s}.side button.active{background:white;color:var(--deep);font-weight:900;box-shadow:0 4px 13px rgba(40,55,47,.04)}
.storecopy{background:linear-gradient(135deg,#edf2ee,#f7f1e6);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:10px}.storecopy strong{font-size:13px}.storecopy p{margin:4px 0 0;font-size:10px;color:var(--muted);line-height:1.55}
.rows{display:grid;gap:11px}.row{display:grid;grid-template-columns:86px 1fr;gap:11px;background:white;border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:0 7px 22px rgba(40,55,47,.04);cursor:pointer;text-align:left;transition:.16s}.thumb{width:86px;height:96px;border-radius:16px;display:grid;place-items:center;font-size:34px;position:relative;overflow:hidden}.thumb:after{content:"";position:absolute;width:60px;height:60px;right:-17px;top:-18px;background:rgba(255,255,255,.4);border-radius:50%}.row h3{font-size:14px;margin:4px 0}.row p{font-size:10px;color:#69726d;line-height:1.55;margin:0}.tags{margin-top:6px}.tag{font-size:9px;background:#f1f4f1;color:#6a746e;padding:4px 6px;border-radius:999px;margin-right:3px}.empty{background:white;border:1px solid var(--line);border-radius:20px;padding:25px 14px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.top{height:64px;display:flex;align-items:center;justify-content:space-between}.back{width:42px;height:42px;border-radius:15px;border:1px solid var(--line);background:white;display:grid;place-items:center;font-size:23px;cursor:pointer}.visual{height:300px;border-radius:29px;display:grid;place-items:center;font-size:86px;box-shadow:var(--shadow);position:relative;overflow:hidden}.visual:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;right:-38px;top:-50px;background:rgba(255,255,255,.45)}.badge{position:absolute;left:15px;top:15px;background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.85);padding:6px 10px;border-radius:999px;font-size:10px;font-weight:850;color:var(--deep)}
.dname{font-size:31px;font-weight:950;letter-spacing:-.05em;margin:21px 0 6px}.promise{font-size:15px;line-height:1.75;color:#5e6962;margin:0}.pills{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 4px}.pill{font-size:10px;padding:6px 9px;border-radius:999px;background:#eef2ef;color:#637068}.block{background:white;border:1px solid var(--line);border-radius:23px;padding:18px;margin-top:14px}.block h2{font-size:18px;margin:0 0 12px}.pain{font-size:12px;line-height:1.65;padding:10px 0;border-bottom:1px solid #f0ede7}.pain:last-child{border:0}.method{display:flex;gap:11px;margin:13px 0}.method .mi{width:40px;height:40px;flex:0 0 40px;border-radius:13px;background:var(--soft);display:grid;place-items:center}.method strong{font-size:13px}.method p{font-size:11px;color:var(--muted);margin:3px 0 0;line-height:1.55}
.sample-list{display:grid;gap:8px}.sample-task{border:0;width:100%;background:#f6f3ed;border-radius:15px;padding:12px 13px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;color:var(--ink);transition:.16s}.sample-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid #809087;display:grid;place-items:center;font-size:11px;flex:0 0 20px}.sample-task.done{background:#eaf1ec}.sample-task.done .sample-dot{background:var(--deep);color:white;border-color:var(--deep)}.sample-task.done .sample-text{text-decoration:line-through;color:#7b847e}.sample-summary{font-size:10px;color:var(--muted);margin:10px 2px 0}
.sticky-cta{position:sticky;bottom:86px;padding-top:16px;z-index:9;background:linear-gradient(180deg,rgba(246,242,234,0),var(--bg) 35%)}
.trial-progress{display:flex;gap:6px;padding:6px 0 18px}.trial-progress span{height:4px;flex:1;border-radius:99px;background:#e0ddd6}.trial-progress span.on{background:var(--green)}.trial-card{background:white;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:var(--shadow)}.trial-card .mini{font-size:11px;color:var(--green);font-weight:850}.trial-card h1{font-size:25px;line-height:1.3;margin:8px 0 8px;letter-spacing:-.04em}.trial-card p{font-size:12px;color:var(--muted);line-height:1.65}.options{display:grid;gap:10px;margin-top:18px}.option{border:1px solid var(--line);background:#fbfaf7;border-radius:17px;padding:14px;text-align:left;cursor:pointer;font-size:13px;transition:.16s}.option:hover,.option.selected{border-color:#9fb5aa;background:#edf3ef}.trial-note{margin-top:18px;background:#edf3ef;border-radius:18px;padding:14px;font-size:12px;line-height:1.7;color:#4f6259}
.todayhero{padding:30px 4px 17px}.todayhero .mini{font-size:11px;color:var(--green);font-weight:850}.todayhero h1{white-space:pre-line;font-size:29px;letter-spacing:-.045em;line-height:1.22;margin:8px 0}.todayhero p{font-size:13px;color:var(--muted);line-height:1.65}.progressbox{background:white;border:1px solid var(--line);border-radius:19px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between}.progressbox b{font-size:13px}.progressbar{height:7px;background:#edf0ec;border-radius:99px;overflow:hidden;width:150px}.progressbar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:.25s}
.task{display:grid;grid-template-columns:38px 1fr 34px;gap:10px;align-items:center;background:white;border:1px solid var(--line);border-radius:20px;padding:15px;margin:10px 0;cursor:pointer;text-align:left;width:100%;transition:.16s}.num{font-size:11px;color:#9aa09c}.task strong{font-size:13px}.task span{display:block;font-size:10px;color:var(--muted);margin-top:4px}.check{width:30px;height:30px;border:1px solid #ccd5cf;border-radius:50%;display:grid;place-items:center;transition:.16s}.task.done{background:#edf3ef;border-color:#d4e2da}.task.done .check{background:var(--deep);color:white;border-color:var(--deep)}.task.done strong{text-decoration:line-through;color:#6c7871}
.profilecard{background:white;border:1px solid var(--line);border-radius:23px;padding:17px;margin-top:14px}.profileline{display:flex;gap:12px;align-items:center}.picon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:25px}.profilecard h3{margin:0;font-size:16px}.profilecard p{margin:4px 0 0;font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:94px;transform:translate(-50%,15px);width:min(calc(100% - 36px),394px);background:#203c31;color:white;border-radius:18px;padding:12px 16px;font-size:12px;line-height:1.5;opacity:0;pointer-events:none;transition:.22s;z-index:60;box-shadow:0 12px 30px rgba(26,53,43,.25)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){body{background:var(--bg)}.app{box-shadow:none}}
</style>
</head>
<body>

<script>
const categories = [
  {id:'all',name:'全部',icon:'▦',copy:'先不用想得太清楚，看看哪个搭子让你最想点进去。'},

  {id:'relation',name:'关系',icon:'♡',copy:'有些关系不需要立刻解决，先有人陪你把感受说清楚。'}
];
const partners = [
  {id:'sleep',cat:'body',name:'睡眠搭子',icon:'☾',grad:'linear-gradient(145deg,#dce8ed,#eee5db)',promise:'今晚开始，陪你慢慢找回安稳的睡眠节律。',tags:['晚睡','睡不着'],duration:'7天体验',time:'每天5分钟',badge:'轻陪伴',pains:['明明很累，却迟迟不想睡','躺下以后脑子还是停不下来','作息越拖越晚，第二天又很累'],methods:[['🌙','把改变做得更小','每天只给你一两件最值得做的小动作。'],['💬','卡住时先陪你说说','不是催你睡，而是一起找到今晚最难的那一步。']],tasks:['下午两点后不再加咖啡因','睡前30分钟把手机放远一点','上床后做3次慢呼吸'],trial:[['你昨晚大概几点睡？',['23点前','23–1点','1–3点','3点以后']],['现在最困扰你的是什么？',['迟迟不想睡','躺下睡不着','容易醒','早上起不来']],['今晚你愿意从哪一步开始？',['手机放远10分钟','提前10分钟上床','做3次慢呼吸','今天先只观察']]]},

];
const partnerMap = Object.fromEntries(partners.map(p=>[p.id,p]));
const state = {view:'home',category:'all',query:'',partnerId:'emotion',activePartnerId:null,detailDone:{},trialStep:0,trialAnswers:[],todayDone:{}};

function loadState(){
  try{const s=JSON.parse(localStorage.getItem('slimPartnerV31')||'{}'); if(s.activePartnerId)state.activePartnerId=s.activePartnerId;if(s.todayDone)state.todayDone=s.todayDone;}catch(e){}
}
function saveState(){try{localStorage.setItem('slimPartnerV31',JSON.stringify({activePartnerId:state.activePartnerId,todayDone:state.todayDone}));}catch(e){}}
function cat(id){return categories.find(c=>c.id===id)||categories[0]}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),1800)}
function setView(view){state.view=view;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(view+'View').classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));window.scrollTo({top:0,behavior:'smooth'});if(view==='today')renderToday();if(view==='profile')renderProfile();}
function openStore(category='all',query=''){state.category=category;state.query=query;setView('store');renderStore();setTimeout(()=>document.getElementById('storeSearch').focus(),80)}
function openPartner(id){state.partnerId=id;state.detailDone={};renderDetail();setView('detail')}
function activePartner(){return partnerMap[state.activePartnerId||state.partnerId]||partnerMap.emotion}
function renderHomeCats(){const box=document.getElementById('homeCats');box.innerHTML=categories.map(c=>`<button class="cat-btn ${c.id==='all'?'active':''}" data-home-cat="${c.id}"><i>${c.icon}</i>${c.name}</button>`).join('')}
function renderFeatured(){const ids=['sleep','emotion','agency','career'];document.getElementById('featuredGrid').innerHTML=ids.map(id=>{const p=partnerMap[id];return `<button class="product" data-open-partner="${id}"><div class="art" style="background:${p.grad}">${p.icon}</div><div class="pname">${p.name}</div><p class="pline">${p.promise}</p><span class="meta">${p.duration}</span></button>`}).join('')}
function renderStoreSide(){document.getElementById('storeSide').innerHTML=categories.map(c=>`<button data-store-cat="${c.id}" class="${c.id===state.category?'active':''}">${c.name}</button>`).join('')}
function filteredPartners(){const q=state.query.trim().toLowerCase();return partners.filter(p=>{const okCat=state.category==='all'||p.cat===state.category;const hay=[p.name,p.promise,...p.tags,...p.pains].join(' ').toLowerCase();return okCat&&(!q||hay.includes(q))})}
function renderStore(){renderStoreSide();const c=cat(state.category);document.getElementById('storeCopy').innerHTML=`<strong>${c.name==='全部'?'慢慢选，不着急。':c.name+'｜'+c.copy}</strong><p>${c.name==='全部'?c.copy:'你可以先看哪个名字最像你现在的状态。'}</p>`;const list=filteredPartners();document.getElementById('storeRows').innerHTML=list.length?list.map(p=>`<button class="row" data-open-partner="${p.id}"><div class="thumb" style="background:${p.grad}">${p.icon}</div><div><h3>${p.name}　→</h3><p>${p.promise}</p><div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></button>`).join(''):`<div class="empty">暂时没有完全匹配的搭子。<br>换一个词试试，或者先看看「全部」。</div>`}
function renderDetail(){const p=partnerMap[state.partnerId];const done=state.detailDone;document.getElementById('detailInner').innerHTML=`
  <div class="top"><button class="back" data-nav="store">‹</button><div class="sub">搭子详情</div></div>
  <div class="visual" style="background:${p.grad}"><span class="badge">${p.badge}</span>${p.icon}</div>
  <h1 class="dname">${p.name}</h1><p class="promise">${p.promise}</p>
  <div class="pills"><span class="pill">${p.duration}</span><span class="pill">${p.time}</span><span class="pill">可先体验</span></div>
  <div class="block"><h2>也许你正在经历这些</h2>${p.pains.map(x=>`<div class="pain">${x}</div>`).join('')}</div>
  <div class="block"><h2>它会怎么陪你</h2>${p.methods.map(m=>`<div class="method"><div class="mi">${m[0]}</div><div><strong>${m[1]}</strong><p>${m[2]}</p></div></div>`).join('')}</div>
  <div class="block"><h2>今天可能只是这样</h2><div class="sample-list">${p.tasks.map((t,i)=>`<button class="sample-task ${done[i]?'done':''}" data-sample-index="${i}"><span class="sample-dot">${done[i]?'✓':''}</span><span class="sample-text">${t}</span></button>`).join('')}</div><div class="sample-summary" id="sampleSummary">点一下试试。这里不是考试，只是在感受“我愿不愿意做”。</div></div>
  <div class="sticky-cta"><button class="btn btn-primary btn-wide" data-start-trial="${p.id}">免费体验 3 分钟 →</button></div>`}
function startTrial(id){state.partnerId=id;state.trialStep=0;state.trialAnswers=[];renderTrial();setView('trial')}
function renderTrial(){const p=partnerMap[state.partnerId];const step=state.trialStep;document.getElementById('trialProgress').innerHTML=p.trial.map((_,i)=>`<span class="${i<=step?'on':''}"></span>`).join('');if(step>=p.trial.length){document.getElementById('trialBody').innerHTML=`<div class="trial-card"><div class="mini">${p.name} · 体验完成</div><h1>这就是我每天陪你的方式。</h1><p>不要求你一次改变很多。我们只把下一步变得更容易一点。</p><div class="trial-note">今天先从「${p.tasks[0]}」开始。做到了很好，没做到也没有关系，明天还可以回来。</div><div style="height:12px"></div><button class="btn btn-primary btn-wide" data-activate-partner="${p.id}">开始陪伴 →</button><button class="btn btn-light btn-wide" style="margin-top:10px" data-nav="store">再看看其他搭子</button></div>`;return}const q=p.trial[step];document.getElementById('trialBody').innerHTML=`<div class="trial-card"><div class="mini">${p.name} · ${step+1}/${p.trial.length}</div><h1>${q[0]}</h1><p>没有标准答案，选最接近你现在状态的一项就好。</p><div class="options">${q[1].map((o,i)=>`<button class="option" data-trial-option="${i}">${o}</button>`).join('')}</div></div>`}
function chooseTrial(i){const p=partnerMap[state.partnerId];state.trialAnswers[state.trialStep]=p.trial[state.trialStep][1][i];document.querySelectorAll('.option').forEach((el,idx)=>el.classList.toggle('selected',idx===i));setTimeout(()=>{state.trialStep++;renderTrial()},240)}
function activatePartner(id){state.activePartnerId=id;state.todayDone={};saveState();showToast('搭子已经准备好了。今天只做一点点。');setView('today')}
function renderToday(){const p=activePartner();const done=state.todayDone[p.id]||{};const count=Object.values(done).filter(Boolean).length;const pct=Math.round(count/p.tasks.length*100);document.getElementById('todayInner').innerHTML=`
<header class="header"><div class="brandrow"><div class="mark">SP</div><div><div class="brand">Slim Partner</div><div class="sub">今天</div></div></div><button class="iconbtn" data-open-partner="${p.id}">${p.icon}</button></header>
<div class="todayhero"><div class="mini">${p.name} · 今天</div><h1>今天不用做很多。\n我们只往前一点。</h1><p>真正的陪伴不是催你，而是让下一步变得没那么难。</p></div>
<div class="progressbox"><b>今天 ${count}/${p.tasks.length}</b><div class="progressbar"><i style="width:${pct}%"></i></div></div>
<div style="height:8px"></div>${p.tasks.map((t,i)=>`<button class="task ${done[i]?'done':''}" data-today-index="${i}"><div class="num">0${i+1}</div><div><strong>${t}</strong><span>${done[i]?'已经做到了。':'做到了就点一下，不需要写报告。'}</span></div><div class="check">${done[i]?'✓':''}</div></button>`).join('')}
<div class="story" style="margin-top:18px"><div class="ico">♡</div><div><strong>${count===p.tasks.length?'今天已经很好了。':'如果今天不想说话，也可以只来坐一会儿。'}</strong><span>${count===p.tasks.length?'你不需要再证明什么，去生活吧。':'你不需要每次出现都证明自己在进步。'}</span></div></div>`}
function toggleToday(i){const p=activePartner();if(!state.todayDone[p.id])state.todayDone[p.id]={};state.todayDone[p.id][i]=!state.todayDone[p.id][i];saveState();renderToday();const count=Object.values(state.todayDone[p.id]).filter(Boolean).length;showToast(state.todayDone[p.id][i]?(count===p.tasks.length?'今天的三件小事都完成了 🌱':'很好，又往前一点。'):'没关系，随时可以再做。')}
function renderProfile(){const p=activePartner();const done=state.todayDone[p.id]||{};const count=Object.values(done).filter(Boolean).length;document.getElementById('profileInner').innerHTML=`<header class="header"><div class="brandrow"><div class="mark">SP</div><div><div class="brand">我的</div><div class="sub">正在陪你的关系</div></div></div></header><section class="section"><div class="sectionhead"><div><div class="title">我的搭子</div><div class="desc">不是拥有多少，而是谁正在陪你走这一段。</div></div></div><div class="profilecard"><div class="profileline"><div class="picon" style="background:${p.grad}">${p.icon}</div><div><h3>${p.name}</h3><p>${p.duration} · ${state.activePartnerId?'已开启陪伴':'体验搭子'}</p></div></div><button class="btn btn-primary btn-wide" style="margin-top:14px" data-nav="today">${count?'继续今天':'开始今天'}</button></div></section><section class="section"><div class="sectionhead"><div><div class="title">最近的成长</div><div class="desc">只记录真实发生过的变化。</div></div></div><div class="story"><div class="ico">🌱</div><div><strong>今天完成了 ${count} 个小行动</strong><span>这里不强调连续打卡，只看真实发生过什么。</span></div></div></section>`}

loadState();renderHomeCats();renderFeatured();renderStore();renderToday();renderProfile();setView('home');

document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]'); if(nav){const v=nav.dataset.nav;if(v==='store')openStore(state.category,state.query);else setView(v);return}
  const hc=e.target.closest('[data-home-cat]'); if(hc){openStore(hc.dataset.homeCat,'');return}
  const sc=e.target.closest('[data-store-cat]'); if(sc){state.category=sc.dataset.storeCat;renderStore();return}
  const op=e.target.closest('[data-open-partner]'); if(op){openPartner(op.dataset.openPartner);return}
  const st=e.target.closest('[data-start-trial]'); if(st){startTrial(st.dataset.startTrial);return}
  const sm=e.target.closest('[data-sample-index]'); if(sm){const i=+sm.dataset.sampleIndex;state.detailDone[i]=!state.detailDone[i];renderDetail();const n=Object.values(state.detailDone).filter(Boolean).length;document.getElementById('sampleSummary').textContent=n?`你已经点了 ${n}/${partnerMap[state.partnerId].tasks.length} 个。不是承诺，只是在感受哪些动作对你没有压力。`:'点一下试试。这里不是考试，只是在感受“我愿不愿意做”。';showToast(state.detailDone[i]?'这个动作看起来可以。':'先放下也没关系。');return}
  const to=e.target.closest('[data-trial-option]'); if(to){chooseTrial(+to.dataset.trialOption);return}
  const ap=e.target.closest('[data-activate-partner]'); if(ap){activatePartner(ap.dataset.activatePartner);return}
  const ti=e.target.closest('[data-today-index]'); if(ti){toggleToday(+ti.dataset.todayIndex);return}
});

document.getElementById('homeSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){openStore('all',e.target.value)}});
document.getElementById('homeSearch').addEventListener('focus',()=>{document.getElementById('homeSearch').placeholder='输入：睡不好 / 焦虑 / 晋升 / 减脂…'});
document.getElementById('storeSearch').addEventListener('input',e=>{state.query=e.target.value;renderStore()});
document.getElementById('trialBack').addEventListener('click',()=>{if(state.trialStep>0){state.trialStep--;renderTrial()}else openPartner(state.partnerId)});
</script>
</body>
</html>
