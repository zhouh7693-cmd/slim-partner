function visualFor(p,mode='card'){
  if(!p)return '<div class="semantic-generic"></div>';
  const v=coreSemanticVisuals[p.name];
  const iconClass=mode==='small'?' small':(mode==='reco'?' reco':'');
  if(v){const svg=v.svg.replace('class="semantic-icon"',`class="semantic-icon${iconClass}"`);const caption=(mode==='card')?`<span class="semantic-caption">${v.caption}</span>`:'';return `<div class="semantic-visual" title="${p.name}" aria-label="${p.name}">${svg}${caption}</div>`;}
  return `<div class="semantic-visual" title="${p.name}" aria-label="${p.name}"><span class="semantic-generic"></span>${mode==='card'?`<span class="semantic-caption">${p.name.replace('搭子','')}</span>`:''}</div>`;
}

function renderUse(id,restore=false){const p=byId(id);if(!p)return;state.active=id;if(!isTool(p)&&!selected(id))state.selected=[id,...state.selected];state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,12);const pr=progressFor(id);if(!pr.startedAt)pr.startedAt=new Date().toISOString();pr.lastVisit=new Date().toISOString();if(!restore){state.returnView=state.view;setSession({view:state.view,overlay:'use',partnerId:id,utility:null,returnView:state.returnView})}else{state.returnView=state.session.returnView||state.session.view||'home';setSession({view:state.session.view||state.view,overlay:'use',partnerId:id,utility:null,returnView:state.returnView})};updateBagCounts();renderRecent();document.getElementById('useTopName').textContent=p.name;const u=usageFor(p),tasks=todayTaskState(id),doneAll=u.tasks.length>0&&u.tasks.every((_,i)=>tasks.includes(i));const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dayKey(d);days.push({label:['日','一','二','三','四','五','六'][d.getDay()],done:!!pr.days[k]})}const left=Math.max(0,u.tasks.length-tasks.length);document.getElementById('useBody').innerHTML=`<div class="use-identity"><div class="use-icon">${visualFor(p,'small')}</div><div><strong>${p.name}</strong><span>已陪伴 ${Math.max(1,dayCount(id))} 天 · ${left?`今天还有 ${left} 步`:'今天完成了'}</span></div></div><section class="today-card"><h2>${u.headline}</h2><div class="task-list">${u.tasks.map((t,i)=>`<button class="task ${tasks.includes(i)?'done':''}" data-task="${i}"><span class="task-check">${tasks.includes(i)?'✓':''}</span><span>${t}</span></button>`).join('')}</div><div class="complete-state ${doneAll?'show':''}" id="completeState"><strong>今天这一步，完成了。</strong><p>不用很多，能继续就很好。</p></div></section><section class="week-card"><div class="card-title">这一周</div><div class="week-grid">${days.map(d=>`<div class="day ${d.done?'done':''}"><b>${d.done?'✓':'·'}</b><span>周${d.label}</span></div>`).join('')}</div></section><section class="coach-card"><div class="card-title">搭子想对你说</div><p>${u.coach}</p></section><div class="tool-grid">${toolLabels(p).map(x=>`<button class="tool-btn" data-tool="${x}"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M8 12h8M12 8v8"></path></svg>${x}</button>`).join('')}</div></div>`;document.getElementById('usePage').classList.add('open');document.body.style.overflow='hidden';updateActiveStrip();renderCollection();renderProfile();save();if(restore)setTimeout(()=>{document.querySelector('#usePage .panel').scrollTop=state.session.useScroll||0},0)}
function openUse(id){document.getElementById('detail').classList.remove('open');renderUse(id)}
function toggleTask(i){const id=state.active,p=byId(id),u=usageFor(p),arr=todayTaskState(id);const idx=arr.indexOf(i);if(idx>=0)arr.splice(idx,1);else arr.push(i);if(u.tasks.every((_,j)=>arr.includes(j)))progressFor(id).days[dayKey()]=true;else delete progressFor(id).days[dayKey()];save();renderUse(id);updateActiveStrip()}
function renderCollection(){const selectedPartners=state.selected.map(byId).filter(Boolean),running=selectedPartners.filter(p=>started(p.id)),later=selectedPartners.filter(p=>!started(p.id)),favOnly=state.favorites.map(byId).filter(p=>p&&!selected(p.id));const item=(p,mode)=>`<div class="collection-item"><div class="cicon">${visualFor(p,'small')}</div><div><strong>${p.name}</strong><span class="statusline">${mode==='running'?companionStatus(p.id):mode==='later'?'还没开始':'已收藏'}</span></div>${mode==='running'?`<button data-use="${p.id}">继续</button>`:mode==='later'?`<button data-start="${p.id}">开始</button>`:`<button class="detail-link" data-open="${p.id}">详情</button>`}</div>`;document.getElementById('collectionBody').innerHTML=`<section class="collection-hero"><h2>我的搭子</h2><p>想继续的、想试试的，都放在这里。</p></section><section class="collection-section collection-group"><div class="sectionhead"><div><div class="sectiontitle">正在陪伴</div></div></div><div class="collection-list">${running.length?running.map(p=>item(p,'running')).join(''):`<div class="empty">还没有正在陪伴的搭子。</div>`}</div></section><section class="collection-section collection-group"><div class="sectionhead"><div><div class="sectiontitle">想试试</div></div></div><div class="collection-list">${later.length?later.map(p=>item(p,'later')).join(''):`<div class="empty">在搭子馆点“加入”，会先放到这里。</div>`}</div></section>${favOnly.length?`<section class="collection-section collection-group"><div class="sectionhead"><div><div class="sectiontitle">收藏</div></div></div><div class="collection-list">${favOnly.map(p=>item(p,'fav')).join('')}</div></section>`:''}`}
function renderToday(){const id=currentPartnerId()||state.selected[0];document.getElementById('todayBody').innerHTML=id?`<section class="section" style="padding-top:12px"><div class="sectionhead"><div><div class="sectiontitle">今天，继续这一步</div><div class="sectiondesc">不用重新开始，接着来。</div></div></div><div class="current-card"><div class="recent-icon">${visualFor(byId(id),'small')}</div><div><strong>${byId(id).name}</strong><p>${started(id)?companionStatus(id):metaOf(byId(id)).benefit}</p></div><button ${started(id)?`data-use="${id}"`:`data-start="${id}"`}>${started(id)?'继续':'开始'}</button></div></section>`:`<div class="empty" style="margin-top:24px">今天还没有正在陪伴的搭子。<br>去搭子馆挑一个开始。</div>`}
function renderProfile(){const selectedPartners=state.selected.map(byId).filter(Boolean),running=selectedPartners.filter(p=>started(p.id)),later=selectedPartners.filter(p=>!started(p.id));document.getElementById('profileBody').innerHTML=`<section class="collection-section" style="padding-top:12px"><div class="sectionhead"><div><div class="sectiontitle">正在陪伴</div><div class="sectiondesc">回来时，继续原来的位置。</div></div><button class="more" data-nav="store">去搭子馆 →</button></div><div class="collection-list">${running.length?running.map(p=>`<div class="collection-item"><div class="cicon">${visualFor(p,'small')}</div><div><strong>${p.name}</strong><span class="statusline">${companionStatus(p.id)}</span></div><button data-use="${p.id}">继续</button></div>`).join(''):`<div class="empty">还没有正在陪伴的搭子。</div>`}</div></section>${later.length?`<section class="collection-section"><div class="sectionhead"><div><div class="sectiontitle">想试试</div></div></div><div class="collection-list">${later.map(p=>`<div class="collection-item"><div class="cicon">${visualFor(p,'small')}</div><div><strong>${p.name}</strong><span class="statusline">尚未开始</span></div><button data-start="${p.id}">开始</button></div>`).join('')}</div></section>`:''}`}
function openCollection(){renderCollection();setSession({view:state.view,overlay:'collection',utility:null});document.getElementById('collection').classList.add('open');document.body.style.overflow='hidden'}
function closeCollection(){document.getElementById('collection').classList.remove('open');setSession({view:state.view,overlay:null,utility:null});document.body.style.overflow='';updateActiveStrip()}
function openUtility(type){const p=byId(state.active),u=usageFor(p);setSession({view:state.view,overlay:'utility',partnerId:state.active,utility:type});document.getElementById('utilityTitle').textContent=`${p.name} · ${type}`;let html='';if(type==='教练')html=`<p class="utility-copy">今天卡在哪里？写一句就好。</p><textarea id="coachInput" placeholder="比如：我知道要做，但就是不想开始……"></textarea><button class="btn btn-primary btn-wide" style="margin-top:10px" id="coachSend">聊一聊</button><div id="coachReply"></div>`;if(type==='自检')html=`<p class="utility-copy">现在更接近哪一种状态？</p><div class="check-options">${['有点累，想先轻一点','状态还可以，想继续','卡住了，需要重新找下一步'].map(x=>`<button data-check="${x}">${x}</button>`).join('')}</div>`;if(!['教练','自检','进展','分享'].includes(type))html=`<p class="utility-copy">把今天最想留下的一句话写下来。</p><textarea id="noteInput" placeholder="今天发生了什么？">${state.notes[p.id]||''}</textarea><button class="btn btn-primary btn-wide" style="margin-top:10px" id="noteSave">保存</button>`;if(type==='进展'){const done=Object.values(progressFor(p.id).days).filter(Boolean).length;html=`<div class="share-card"><strong>${done} 天</strong><p>已经留下的陪伴记录。不是连续才算，回来就算。</p></div>`}if(type==='分享')html=`<div class="share-card"><strong>${p.name}</strong><p>${metaOf(p).benefit}</p><p>今天，我又走了一小步。</p></div><button class="btn btn-light btn-wide" style="margin-top:10px" id="copyShare">复制分享文案</button>`;document.getElementById('utilityBody').innerHTML=html;document.getElementById('utility').classList.add('open')}
function closeUtility(){document.getElementById('utility').classList.remove('open');setSession({view:state.view,overlay:'use',partnerId:state.active,utility:null});updateActiveStrip()}
function handleUtilityClick(e){const p=byId(state.active),u=usageFor(p);if(e.target.id==='coachSend'){const v=document.getElementById('coachInput').value.trim();document.getElementById('coachReply').innerHTML=`<div class="coach-card"><p>${v?u.coach:'先写一句现在最卡的地方，我会陪你一起拆小。'}</p></div>`}if(e.target.dataset.check){state.selfcheck[p.id]=e.target.dataset.check;save();toast('记下了')}if(e.target.id==='noteSave'){state.notes[p.id]=document.getElementById('noteInput').value;save();toast('已保存')}if(e.target.id==='copyShare'){const text=`${p.name}｜${metaOf(p).benefit}
今天，我又走了一小步。`;navigator.clipboard?.writeText(text);toast('分享文案已复制')}}

load();updateBagCounts();renderNeeds();renderHomeReco();renderRecent();renderDomains();renderSeries();renderUpcoming();renderStore();renderCollection();renderToday();renderProfile();updateActiveStrip();
function restoreSession(){const s=state.session||{};setView(s.view||'home',true);if(s.overlay==='use'&&s.partnerId&&byId(s.partnerId)){renderUse(s.partnerId,true)}else if(s.overlay==='utility'&&s.partnerId&&byId(s.partnerId)){renderUse(s.partnerId,true);setTimeout(()=>openUtility(s.utility||'教练'),20)}else if(s.overlay==='detail'&&s.partnerId&&byId(s.partnerId)){renderDetail(s.partnerId)}else if(s.overlay==='collection'){openCollection()}else updateActiveStrip()}
restoreSession();
document.addEventListener('click',e=>{const reserveBtn=e.target.closest('[data-reserve]');if(reserveBtn){reserve(reserveBtn.dataset.reserve);return}const fav=e.target.closest('[data-favorite]');if(fav){toggleFavorite(fav.dataset.favorite);return}const add=e.target.closest('[data-add]');if(add){e.stopPropagation();toggleSelected(add.dataset.add);return}const need=e.target.closest('[data-need]');if(need){state.need=need.dataset.need;renderNeeds();renderHomeReco();return}const domain=e.target.closest('[data-domain]');if(domain){openStore(domain.dataset.domain,'','all');return}const dfilter=e.target.closest('[data-domain-filter]');if(dfilter){state.domain=dfilter.dataset.domainFilter;state.mode='all';state.q='';renderStore();return}const mode=e.target.closest('[data-mode]');if(mode){state.mode=mode.dataset.mode;state.q='';if(state.mode==='series')state.series='wealth';renderStore();return}const series=e.target.closest('[data-series]');if(series){openSeries(series.dataset.series);return}const open=e.target.closest('[data-open]');if(open){renderDetail(open.dataset.open);return}const start=e.target.closest('[data-start]');if(start){openUse(start.dataset.start);return}const use=e.target.closest('[data-use]');if(use){closeCollection();openUse(use.dataset.use);return}const task=e.target.closest('[data-task]');if(task){toggleTask(Number(task.dataset.task));return}const tool=e.target.closest('[data-tool]');if(tool){openUtility(tool.dataset.tool);return}const nav=e.target.closest('[data-nav]');if(nav){setView(nav.dataset.nav);return}if(e.target.closest('[data-collection]')){openCollection();return}handleUtilityClick(e)});
document.getElementById('detailBack').onclick=()=>{document.getElementById('detail').classList.remove('open');setSession({view:state.view,overlay:null,utility:null});document.body.style.overflow='';updateActiveStrip()};document.getElementById('useBack').onclick=()=>{document.getElementById('usePage').classList.remove('open');document.body.style.overflow='';setSession({view:state.returnView||state.view,overlay:null,utility:null,partnerId:state.active});setView(state.returnView||state.view,true);renderRecent();renderToday();renderProfile();updateActiveStrip()};document.getElementById('collectionBack').onclick=closeCollection;document.getElementById('utilityClose').onclick=closeUtility;
document.getElementById('homeSearch').addEventListener('keydown',e=>{if(e.key==='Enter')openStore('all',e.target.value,'all')});document.getElementById('homeSearchBottom').addEventListener('keydown',e=>{if(e.key==='Enter')openStore('all',e.target.value,'all')});document.getElementById('homeSearchGo').onclick=()=>openStore('all',document.getElementById('homeSearchBottom').value,'all');document.getElementById('storeSearch').addEventListener('input',e=>{state.q=e.target.value;state.domain='all';state.mode='all';renderStore()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(document.getElementById('utility').classList.contains('open'))closeUtility();else if(document.getElementById('collection').classList.contains('open'))closeCollection();else if(document.getElementById('usePage').classList.contains('open')){document.getElementById('usePage').classList.remove('open');setSession({view:state.view,overlay:null,partnerId:state.active})}else if(document.getElementById('detail').classList.contains('open')){document.getElementById('detail').classList.remove('open');setSession({view:state.view,overlay:null})}});

const usePanel=document.querySelector('#usePage .panel');let scrollTimer=null;usePanel.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{if(document.getElementById('usePage').classList.contains('open'))setSession({useScroll:usePanel.scrollTop,partnerId:state.active,overlay:'use'})},120)});
window.addEventListener('pagehide',()=>{if(document.getElementById('usePage').classList.contains('open'))state.session={...state.session,overlay:'use',partnerId:state.active,useScroll:usePanel.scrollTop};save()});
window.addEventListener('beforeunload',()=>{if(document.getElementById('usePage').classList.contains('open'))state.session={...state.session,overlay:'use',partnerId:state.active,useScroll:usePanel.scrollTop};save()});

</script>
</body></html>
